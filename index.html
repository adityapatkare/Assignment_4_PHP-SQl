<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4 - Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <form id="registration-form">
            <h2>Registration Form</h2>

            <input type="text" id="full-name" placeholder="Full Name" autocomplete="name" required>

            <!-- FIXED: type="tel" hides arrows, maxlength stops extra digits, and oninput blocks text characters -->
            <input type="tel" id="mobile-number" placeholder="Mobile Number" maxlength="10" minlength="10"
                oninput="this.value = this.value.replace(/[^0-9]/g, '');" autocomplete="tel" required>

            <input type="email" id="email" placeholder="Email" autocomplete="email" required>

            <div class="password-box">
                <input type="password" id="password" placeholder="Password" autocomplete="new-password" required>
                <button type="button" id="toggle-password">Show</button>
            </div>

            <button type="submit">Submit</button>
        </form>

        <div id="message"></div>
    </div>

    <script src="https://jquery.com"></script>
    <script src="script.js"></script>
</body>

</html>
